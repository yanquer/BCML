name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  ACTIONS_ALLOW_UNSECURE_COMMANDS: 'true'

jobs:
  check_changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      npm_assets_changed: ${{ steps.get_changes.outputs.npm_assets }}
      rust_src_changed: ${{ steps.get_changes.outputs.rust_src }}
    steps:
      - uses: actions/checkout@v3
      - uses: dorny/paths-filter@v2
        id: get_changes
        with:
          filters: |
            npm_assets:
              - 'bcml/assets/**'
            rust_src:
              - 'src/**'
              - 'bootstrap.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '_build_backend.py'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/build.yml'

  npm_build:
    name: npm build
    needs: check_changes
    if: ${{ needs.check_changes.outputs.npm_assets_changed == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14.x, 15.x, 16.x, 17.x, 18.x]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
        working-directory: bcml/assets
      - run: npm run build
        working-directory: bcml/assets

  maturin_build_linux:
    name: Maturin (Linux)
    needs: check_changes
    if: ${{ needs.check_changes.outputs.rust_src_changed == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.17"
        python-version: "3.9"
    - name: Check Python lockfile
      run: uv lock --check
    - name: Test build backend
      run: |
        uv sync --locked --only-dev
        uv run --frozen --no-sync python -m unittest discover -s tests -v
    - name: Install pinned Rust toolchain
      id: rust
      shell: bash
      run: |
        rustup show active-toolchain
        echo "channel=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - name: install-cmake
      uses: Symbitic/install-cmake@v0.1.0
    - name: Patch roead version
      run: sed -i 's/<0.10.4/0.10.4/g' Cargo.toml
    - name: Check
      run: cargo check --locked --verbose
    - uses: messense/maturin-action@v1
      with:
        maturin-version: v0.12.20
        command: build
        args: --release --cargo-extra-args=--locked
        rust-toolchain: ${{ steps.rust.outputs.channel }}

  maturin_build_win:
    name: Maturin (Windows)
    needs: check_changes
    if: ${{ needs.check_changes.outputs.rust_src_changed == 'true' }}
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.17"
        python-version: "3.9"
    - name: Check Python lockfile
      run: uv lock --check
    - name: Test build backend
      run: |
        uv sync --locked --only-dev
        uv run --frozen --no-sync python -m unittest discover -s tests -v
    - name: Install pinned Rust toolchain
      id: rust
      shell: bash
      run: |
        rustup show active-toolchain
        echo "channel=$(rustup show active-toolchain | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
    - uses: messense/maturin-action@v1
      name: Build with Maturin
      with:
        maturin-version: v0.12.20
        command: build
        args: --release --cargo-extra-args=--locked
        rust-toolchain: ${{ steps.rust.outputs.channel }}
