name: Upload Python Package

on:
    release:
        types: [created]

jobs:
    deploy_linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v2
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.8.17"
                  python-version: "3.9"
            - name: Set up Node.js
              uses: actions/setup-node@v1
              env:
                  RUNNER_TEMP: /tmp
              with:
                  node-version: "14.x"
            - name: Install Python dependencies
              run: |
                  uv sync --locked --only-dev
            - name: Generate webpack bundle
              working-directory: ./bcml/assets
              run: |
                  npm install
                  ./node_modules/.bin/webpack --mode production
            - name: Build docs
              run: |
                  uv run --frozen --no-sync mkdocs build -d ./bcml/assets/help
            - name: Patch roead version
              run: sed -i 's/<0.10.4/0.10.4/g' Cargo.toml
            - uses: actions-rs/toolchain@v1
              name: Install Rust
              with:
                profile: minimal
                toolchain: nightly
                override: true
            - uses: messense/maturin-action@v1
              name: Publish with Maturin
              with:
                maturin-version: v0.12.20
                command: publish
                args: --no-sdist -u ${{ secrets.PYPI_USERNAME }} -p ${{ secrets.PYPI_PASSWORD }} --skip-existing
                rust-toolchain: nightly
    deploy_windows:
        runs-on: windows-2019
        steps:
            - uses: actions/checkout@v2
            # 保留发行包原有的 Python 3.7/3.8 构建目标，uv 开发环境使用 3.9。
            - name: Set up Python 3.7
              uses: actions/setup-python@v2
              with:
                  python-version: "3.7"
            - name: Set up Python 3.8
              uses: actions/setup-python@v2
              with:
                  python-version: "3.8"
            - name: Set up uv
              uses: astral-sh/setup-uv@v6
              with:
                  version: "0.8.17"
                  python-version: "3.9"
            - name: Set up Node.js
              uses: actions/setup-node@v1
              # env:
              #     RUNNER_TEMP: /tmp
              with:
                  node-version: "14.x"
            - name: Install Python dependencies
              run: |
                  uv sync --locked --only-dev
            - name: Generate webpack bundle
              working-directory: .\bcml\assets
              run: |
                  npm install
                  npm run build
            - name: Build docs
              run: |
                  uv run --frozen --no-sync mkdocs build -d .\bcml\assets\help
            - uses: actions-rs/toolchain@v1
              name: Install Rust
              with:
                profile: minimal
                toolchain: nightly
                override: true
            - name: Publish with Maturin
              run: |
                  uv run --frozen --no-sync maturin publish -f --no-sdist -u ${{ secrets.PYPI_USERNAME }} -p ${{ secrets.PYPI_PASSWORD }} --skip-existing
