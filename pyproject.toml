[build-system]
requires = ["maturin==0.12.20", "tomli>=1.1,<3; python_version < '3.11'"]
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "bcml"
version = "3.10.8"
description = "A mod manager for The Legend of Zelda: Breath of the Wild"
authors = [{ name = "NiceneNerd", email = "macadamiadaze@gmail.com" }]
license = { file = "docs/LICENSE.md" }
dependencies = [
    "botw-utils~=0.2.3",
    "cefpython3~=66.1; platform_system == 'Windows'",
    "oead~=1.2.6",
    "packaging~=21.3",
    "pythonnet~=3.0.1",
    "PyQt5; platform_system == 'Linux'",
    "pyqtwebengine~=5.15.2; platform_system == 'Linux'",
    "pywebview==3.7.2",
    "QtPy; platform_system == 'Linux'",
    "requests~=2.27.1",
    "rstb>=1.2.2",
    "xxhash~=3.2",
]
requires-python = ">=3.7,<3.11"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
]
scripts = { bcml-debug = "bcml.__main__:main_debug" }
gui-scripts = { bcml = "bcml.__main__:main" }

[project.urls]
repository = "https://github.com/NiceneNerd/BCML"
homepage = "https://gamebanana.com/tools/6624"

[tool.maturin]
# 原生构建不重新选择依赖，并让 Maturin 自动把 Cargo.lock 写入源码包。
cargo-extra-args = "--locked"

[dependency-groups]
dev = [
    "maturin>=0.12,<0.13",
    "mkdocs>=1.4,<2",
    "mkdocs-material>=8,<10",
]

[tool.uv.dependency-groups]
# uv 开发工具使用 Python 3.8+，发行包继续兼容 Python 3.7。
dev = { requires-python = ">=3.8" }
